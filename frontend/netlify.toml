# Netlify sozlamasi: sayt oddiy statik fayllardan iborat, build kerak emas.
[build]
  publish = "."

# CSS/JS har safar serverdan o'zgargan-o'zgarmaganini so'raydi (o'zgarmasa 304, tez ochiladi).
# Shunda yangilangan saytni ko'rishda eski fayl keshda qolib, sayt buzilmaydi.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Xavfsizlik sarlavhalari
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
